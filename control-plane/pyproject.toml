[project]
name = "agentx-control-plane"
version = "0.1.0"
description = "AgentX control plane: task state machine, GitHub + Slack integration, PR lifecycle"
requires-python = ">=3.12"
dependencies = [
    "agentx-schemas",
    "agentx-runner",
]

[project.scripts]
agentx-reaper = "agentx_control_plane.providers.reaper:main"
agentx-sandbox-conformance = "agentx_control_plane.sandbox_conformance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_control_plane"]

[tool.uv.sources]
agentx-schemas = { workspace = true }
agentx-runner = { workspace = true }
