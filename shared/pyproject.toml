[project]
name = "agentx-schemas"
version = "0.1.0"
description = "Versioned wire schemas shared by the control plane and the runner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_schemas"]
