# Illustrative only: replace URLs and commit IDs before registration.
name: payments
revision: 1
repositories:
  - name: payments-api
    url: https://git.example.test/payments-api.git
    path: repo/payments-api
    defaultBranch: main
    credentialRef: payments-readwrite
setup:
  - cwd: repo/payments-api
    executable: npm
    args: [ci]
    timeoutSeconds: 600
readiness:
  - cwd: repo/payments-api
    executable: npm
    args: [test, "--", --runInBand]
    timeoutSeconds: 600
orchestratorInstructions: Delegate every repository read, edit, build, and test to the remote AgentX worker.
