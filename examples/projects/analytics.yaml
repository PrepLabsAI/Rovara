# Illustrative only: administrators must substitute real immutable values.
name: analytics
revision: 1
repositories:
  - name: analytics-pipeline
    url: https://git.example.test/analytics-pipeline.git
    path: repo/analytics-pipeline
    defaultBranch: main
    credentialRef: analytics-readwrite
setup:
  - cwd: repo/analytics-pipeline
    executable: uv
    args: [sync, --frozen]
    timeoutSeconds: 600
readiness:
  - cwd: repo/analytics-pipeline
    executable: uv
    args: [run, pytest]
    timeoutSeconds: 600
orchestratorInstructions: Use the remote worker for every code or shell operation.
