[project]
name = "agentx-runner"
version = "0.1.0"
description = "In-sandbox supervisor: hosts an EngineAdapter and streams normalized events"
requires-python = ">=3.12"
dependencies = [
    "agentx-schemas",
]

[project.scripts]
agentx-runner = "agentx_runner.cli:main"
agentx-conformance = "agentx_runner.conformance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_runner"]

[tool.uv.sources]
agentx-schemas = { workspace = true }
