# TEMPORARY timing experiment (draft PR #1328, not for merge): Rovara's FULL CI on mainline's code,
# with every work job on the owner's Mac at once (Rovara Build routes them; the Mac takes up to 13).
# Same jobs as ci.yml's full mode: quick, typecheck, release-check, build, and 8 test shards.
# Linux-only bits are swapped for macOS ones (gitleaks binary, shasum); the root-only step is dropped.
name: rovara-build mac full CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: rb-mac-full-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # mainline's head when the experiment started, so every job builds the same code.
  MAINLINE_SHA: 2fc193e6fbff389bb9a16e4605fb2f5841b48946

jobs:
  route:
    uses: ./.github/workflows/rb-route.yml
    permissions:
      id-token: write
      contents: read
    with:
      endpoint: ${{ vars.ROVARA_BUILD_URL }}

  quick:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.MAINLINE_SHA }}", fetch-depth: 2 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }  # no Actions cache: ~/.npm is already on the Mac
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node scripts/complexity.ts check

  typecheck:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.MAINLINE_SHA }}", fetch-depth: 2 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }  # no Actions cache: ~/.npm is already on the Mac
      - run: npm ci
      - run: npm run typecheck:all

  release-check:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.MAINLINE_SHA }}", fetch-depth: 2 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }  # no Actions cache: ~/.npm is already on the Mac
      - run: npm ci
      - run: npm run build
      - run: npm run infra:synth
      - name: Release builds are reproducible
        run: |
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-a"
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-b"
          diff "$RUNNER_TEMP/release-a/release.json" "$RUNNER_TEMP/release-b/release.json"
          npm run release:verify -- "$RUNNER_TEMP/release-a"

  build:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.MAINLINE_SHA }}", fetch-depth: 2 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }  # no Actions cache: ~/.npm is already on the Mac
      - run: npm ci
      - run: npm run build
      - name: Pack the build output
        run: |
          git ls-files --others --ignored --exclude-standard --directory | grep -v 'node_modules/' > "$RUNNER_TEMP/build-files.txt"
          test -s "$RUNNER_TEMP/build-files.txt"
          tar -czf "$RUNNER_TEMP/build-output.tgz" -T "$RUNNER_TEMP/build-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.tgz
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [route, build]
    name: test (${{ matrix.shard }}/8)
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.MAINLINE_SHA }}", fetch-depth: 2 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }  # no Actions cache: ~/.npm is already on the Mac
      - run: npm ci
      - name: Install gitleaks 8.30.1 (macOS arm64, checksum pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - run: tar -xzf "$RUNNER_TEMP/build-output/build-output.tgz"
      # 8 shards share one 15-core Mac, so each gets 2 test workers (vitest's default would be 14 each).
      - run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=2
