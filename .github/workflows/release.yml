name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

# A second tag push (or a re-run) must never race a release already publishing: cancelling a
# half-published release would leave images, the GitHub release and npm inconsistent with each
# other. Keyed by ref, not workflow, so only the same tag's own runs share the group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # #1559: check whether GitHub CI already passed on byte-identical code (scripts/release-ci-proof.ts), then build the workspace and synthesize the CDK stacks.
  # `infra:synth` always runs even when the CI proof lets the workflow skip typecheck, lint and the test shards; when no proof is found, the build output is
  # packed once and handed to `lint` and the 8 parallel test shards.
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    permissions: { contents: read, checks: read }
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
      candidate: ${{ steps.proof.outputs.candidate }}
    steps:
      # Depth 2 keeps a merge commit and both of its parents so release-ci-proof.ts can match the PR head's tree as well as the merge commit's own tree.
      - uses: actions/checkout@v5
        with: { fetch-depth: 2, persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - name: Check CI proof
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROVEN=false
          CANDIDATE=""
          if node scripts/release-ci-proof.ts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --ignore-linux-runtime --out "$RUNNER_TEMP/ci-proof.json"; then
            PROVEN=true
            CANDIDATE=$(jq -r '.candidate // ""' "$RUNNER_TEMP/ci-proof.json")
            echo "Release checks path: proof reused (candidate commit $CANDIDATE); skipping typecheck, lint and tests (build and infra:synth still run)."
          else
            echo "Release checks path: full checks (no usable CI proof; running typecheck, lint, 8 test shards, build and infra:synth)."
          fi
          {
            echo "proven=$PROVEN"
            echo "candidate=$CANDIDATE"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      # Pack the built packages once for `lint` and the 8 test shards before `infra:synth` writes `cdk.out/`.
      - name: Pack the build output
        if: steps.proof.outputs.proven != 'true'
        run: |
          git ls-files --others --ignored --exclude-standard --directory | grep -v 'node_modules/' > "$RUNNER_TEMP/build-files.txt"
          test -s "$RUNNER_TEMP/build-files.txt"
          tar -czf "$RUNNER_TEMP/build-output.tgz" -T "$RUNNER_TEMP/build-files.txt"
      - if: steps.proof.outputs.proven != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.tgz
          retention-days: 1
          if-no-files-found: error
      - run: npm run infra:synth

  typecheck:
    needs: prepare
    if: needs.prepare.outputs.proven != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run typecheck:all

  lint:
    needs: prepare
    if: needs.prepare.outputs.proven != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Unpack the build output
        run: tar -xzf "$RUNNER_TEMP/build-output/build-output.tgz"
      - run: npm run lint

  test-shards:
    needs: prepare
    if: needs.prepare.outputs.proven != 'true'
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      # tests/unit/port-guard.test.ts runs the real secret scan, and its re-check 3 cases fail loudly without gitleaks (they never skip): v0.5.0's
      # first run stopped here for it. The same step, byte for byte, as ci.yml's test and port-guard jobs (tests/contract/release-workflow.test.ts).
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          if [ "$(uname -m)" = aarch64 ]; then arch=arm64; sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080; else arch=x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb; fi
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${arch}.tar.gz"
          echo "${sum}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Unpack the build output
        run: tar -xzf "$RUNNER_TEMP/build-output/build-output.tgz"
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: npm test -- --shard="$SHARD/$SHARD_TOTAL"

  # Gate job that `images` waits on: passes when `prepare` (build + infra:synth) succeeded and either CI proof was reused or all fallback checks passed.
  test:
    needs: [prepare, typecheck, lint, test-shards]
    if: always() && !cancelled()
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version }
      - name: Verify release test gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-ci-proof.ts --gate

  images:
    needs: test
    # #1570: `!cancelled()` and the direct need's own result, never the implicit success(): that is false whenever a job earlier in the chain was skipped,
    # and a reused CI proof skips typecheck, lint and test-shards on purpose, which skipped every publishing job while the run showed success (v0.5.3).
    if: "!cancelled() && needs.test.result == 'success' && vars.AGENTX_PUBLISH_ENABLED == 'true'"
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    # The emulated amd64 build of the worker (only with AGENTX_PUBLISH_WORKER_AMD64) is slower than a native one; bounded so a stuck build cannot hold the release open.
    timeout-minutes: 90
    permissions: { contents: read, id-token: write }
    outputs:
      worker: ${{ steps.push.outputs.worker }}
      slack: ${{ steps.push.outputs.slack }}
      executor: ${{ steps.push.outputs.executor }}
      gateway: ${{ steps.push.outputs.gateway }}
    steps:
      # AGENTX_PUBLISH_ROLE_ARN's trust policy only allows this repository's v* tags (by immutable ID),
      # so a workflow_dispatch run must be re-run from the tag ref itself; fail clearly here instead
      # of letting configure-aws-credentials fail later with an opaque AssumeRoleWithWebIdentity
      # error. GITHUB_REF/GITHUB_REF_NAME are the runner's own default environment variables, read
      # directly rather than interpolated in as `${{ github.ref }}`, so the version this job (and
      # every job below it) uses comes from one source of truth: the tag, never a workflow_dispatch
      # input.
      - name: Require a version tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::release.yml publishing jobs must run from a version tag (refs/tags/v*), not $GITHUB_REF. Re-run workflow_dispatch from the tag." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release.yml requires a tag name of the form vX.Y.Z, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # A version tag on a commit that never reached mainline (a feature branch, an unmerged PR)
      # would otherwise publish unreviewed code, and npm never takes a version number back. The
      # compare API answers "identical" or "behind" exactly when the tagged commit is mainline's
      # tip or one of its ancestors. This catches mistakes only: the workflow that runs is the
      # tagged commit's own copy, so someone who can push tags could remove this step; the v* tag
      # ruleset in docs/releases.md is what restricts who can tag.
      - name: Require the tagged commit to be on mainline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/mainline...$GITHUB_SHA" --jq .status); then
            echo "::error::could not compare $GITHUB_REF_NAME ($GITHUB_SHA) with mainline" >&2
            exit 1
          fi
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on mainline (compare status: $status). Tag a commit on mainline." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      # The executor image is smoke-tested before it is pushed (scripts/executor-smoke.ts, the definition CI and test-deploy use), which needs the repository's
      # dependencies and build. They run here, before any AWS credential exists in the environment, and only when the executor is published.
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        run: npm ci && npm run build
      # Chromium's own sandbox needs unprivileged user namespaces, which Ubuntu 24.04 blocks for AppArmor-confined containers on the runner (the same CI-only
      # step as the linux-runtime job in ci.yml); production hosts (Amazon Linux 2023) have no such restriction.
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "no AppArmor userns restriction on this kernel"
      # Register amd64 emulation before assuming the publish role, using a pinned binfmt image. Only when the worker's amd64 half is built (see the push step).
      - if: vars.AGENTX_PUBLISH_WORKER_AMD64 == 'true'
        uses: docker/setup-qemu-action@v3
        with: { platforms: amd64, image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AGENTX_PUBLISH_ROLE_ARN }}", aws-region: us-east-1 }
      - uses: aws-actions/amazon-ecr-login@v2
        with: { registry-type: public }
      # The runner is arm64, so the worker's linux/amd64 half (DEC 254zm), when it is built, is built under emulation: register amd64 only (arm64 is native here).
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - id: push
        # Without an explicit shell, GitHub Actions runs a Linux run: step's script as plain
        # `bash -e {0}`, not `bash --noprofile --norc -eo pipefail {0}`: a failing
        # `docker buildx imagetools inspect` piped into `tr -d '"'` would be swallowed by the pipe
        # and this step would carry on with an empty (or stale) registry_digest instead of failing.
        # `shell: bash` is what turns pipefail on.
        shell: bash
        env:
          ALIAS: ${{ vars.AGENTX_ECR_PUBLIC_ALIAS }}
          VERSION: ${{ github.ref_name }}
          # The executor image needs its own ECR Public repository and publish-role access (docs/releases.md); off until an owner sets this to true.
          PUBLISH_EXECUTOR: ${{ vars.AGENTX_PUBLISH_EXECUTOR_IMAGE }}
          # The worker's linux/amd64 half (DEC 254zm) is off until an owner sets this to true (#1563): built under QEMU it took over 20 minutes of `npm ci` and
          # then lost its registry connection (v0.5.1), and no install runs it while ROVARA_MACHINE_SIZE_X86 is off. Off, the worker is one arm64 image, as up to 0.4.0.
          PUBLISH_WORKER_AMD64: ${{ vars.AGENTX_PUBLISH_WORKER_AMD64 }}
        run: |
          VERSION="${VERSION#v}"
          # The executor goes first: its smoke test can fail, and a pushed tag is immutable, so a failure must stop the job before the worker, slack or gateway image is pushed.
          images="worker slack gateway"
          if [ "$PUBLISH_EXECUTOR" = "true" ]; then images="executor $images"; fi
          worker_platforms=linux/arm64; if [ "$PUBLISH_WORKER_AMD64" = "true" ]; then worker_platforms=linux/arm64,linux/amd64; fi
          for image in $images; do
            dockerfile=environments/base/Dockerfile
            [ "$image" = slack ] && dockerfile=environments/slack/Dockerfile
            [ "$image" = executor ] && dockerfile=environments/e2e-executor/Dockerfile
            [ "$image" = gateway ] && dockerfile=environments/model-gateway/Dockerfile
            repo="public.ecr.aws/$ALIAS/agentx-$image"
            # With AGENTX_PUBLISH_WORKER_AMD64, the worker is a multi-architecture image (DEC 254zm): one index digest whose linux/arm64 image is what every
            # install has always run and whose linux/amd64 image is what the x86 machine sizes pull. Without it, arm64 only. The Slack and executor images stay arm64 only.
            case "$image" in
              worker) platforms=$worker_platforms ;;
              *) platforms=linux/arm64 ;;
            esac
            # --provenance=false --sbom=false: without them, buildx adds provenance/SBOM attestation
            # entries to the pushed OCI image (an index even for one platform), and the digest this job
            # would read back is the index's, not the image's: the wrong thing to pin the release to.
            # With them, a single-platform push is one image manifest and the worker's is an index
            # that lists exactly its platforms.
            if [ "$image" = executor ]; then
              # The executor is built into the local Docker, smoke-tested as the host runs it (Chromium's sandbox on), and that same loaded image is pushed, so the
              # published bytes are the smoke-tested bytes. A failing smoke test stops the job before anything is pushed.
              docker buildx build --platform linux/arm64 --provenance=false --sbom=false --file "$dockerfile" --tag "$repo:$VERSION" --load .
              npx tsx scripts/executor-smoke.ts "$repo:$VERSION"
              digest=$(docker push "$repo:$VERSION" | tee /dev/stderr | sed -n 's/^.*digest: \(sha256:[a-f0-9]\{64\}\).*$/\1/p' | tail -1)
              if [ -z "$digest" ]; then
                echo "::error::docker push of $repo:$VERSION reported no digest" >&2
                exit 1
              fi
            else
              docker buildx build --platform "$platforms" --provenance=false --sbom=false --file "$dockerfile" --tag "$repo:$VERSION" --push --metadata-file "$RUNNER_TEMP/$image.json" .
              digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$image.json")
            fi
            # Don't trust the local build metadata alone: read back what the registry actually
            # holds for this tag, and fail loudly if it's missing or doesn't match what was just
            # pushed, rather than shipping a release pinned to a digest nobody can pull.
            registry_digest=$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ -z "$registry_digest" ] || [ "$registry_digest" = "null" ]; then
              echo "::error::registry returned no digest for $repo:$VERSION after push" >&2
              exit 1
            fi
            if [ "$registry_digest" != "$digest" ]; then
              echo "::error::registry digest $registry_digest for $repo:$VERSION does not match the pushed digest $digest" >&2
              exit 1
            fi
            if [ "$image" = worker ] && [ "$PUBLISH_WORKER_AMD64" = "true" ]; then
              # The registry, not the build, says which platforms the worker digest serves: a two-platform release whose worker lacks either one must not ship.
              # (An arm64-only worker is one image manifest, not an index, exactly as the releases before DEC 254zm.)
              served=$(docker buildx imagetools inspect --raw "$repo:$VERSION" | jq -r '[.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"] | sort | join(",")')
              if [ "$served" != "linux/amd64,linux/arm64" ]; then
                echo "::error::the worker image $repo:$VERSION serves \"$served\", not linux/amd64 and linux/arm64" >&2
                exit 1
              fi
            fi
            echo "$image=$repo@$registry_digest" >> "$GITHUB_OUTPUT"
          done

  release:
    needs: images
    # #1570: as `images`, on the direct need's result.
    if: "!cancelled() && needs.images.result == 'success' && vars.AGENTX_PUBLISH_ENABLED == 'true'"
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      # release:build imports workspace packages (e.g. @agentx/contracts) by their built dist/
      # output, which is gitignored: without this, a fresh checkout fails with
      # ERR_MODULE_NOT_FOUND before release:build even starts.
      - run: npm run build
      - env:
          VERSION: ${{ github.ref_name }}
          WORKER: ${{ needs.images.outputs.worker }}
          SLACK: ${{ needs.images.outputs.slack }}
          EXECUTOR: ${{ needs.images.outputs.executor }}
          GATEWAY: ${{ needs.images.outputs.gateway }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          executor_flag=()
          if [ -n "$EXECUTOR" ]; then executor_flag=(--executor-image "$EXECUTOR"); fi
          npm run release:build -- --version "$VERSION" --out "$RUNNER_TEMP/release" --worker-image "$WORKER" --slack-image "$SLACK" --gateway-image "$GATEWAY" "${executor_flag[@]}"
          npm run release:verify -- "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && tar -czf "$RUNNER_TEMP/agentx-$VERSION.tar.gz" .)
          gh release create "v$VERSION" --verify-tag --title "Rovara $VERSION" --notes-from-tag "$RUNNER_TEMP/agentx-$VERSION.tar.gz" "$RUNNER_TEMP/release/release.json"

  npm:
    needs: release
    # #1570: as `images`, on the direct need's result.
    if: "!cancelled() && needs.release.result == 'success' && vars.AGENTX_PUBLISH_ENABLED == 'true'"
    # GitHub-hosted, never Blacksmith (#1568): the npm registry accepts trusted-publishing provenance only from GitHub-hosted runners, and refused
    # v0.5.2's publish from a Blacksmith runner ("Unsupported GitHub Actions runner environment: self-hosted").
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      # release:pack-cli bundles packages/cli, which resolves @agentx/contracts through its built
      # dist/ output (gitignored): without this, a fresh checkout fails with ERR_MODULE_NOT_FOUND.
      - run: npm run build
      # Trusted publishing (OIDC, no stored token) needs a newer npm than Node 22 ships.
      - run: npm install -g npm@11
      - env:
          VERSION: ${{ github.ref_name }}
          NAME: ${{ vars.AGENTX_NPM_PACKAGE || '@preplabsai/rovara-code' }}
        run: |
          VERSION="${VERSION#v}"
          npm run release:pack-cli -- --version "$VERSION" --name "$NAME" --out "$RUNNER_TEMP/cli"
          # A hand-published first version (see docs/releases.md's one-time owner setup) means the
          # very first automated run would otherwise hit this same version already on the registry
          # and fail; npm refuses to publish over an existing version. Check first and skip cleanly
          # instead of failing the job.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping npm publish"
            exit 0
          fi
          # No provenance flag needed: npm trusted publishing adds provenance automatically for
          # this public repository.
          npm publish "$RUNNER_TEMP"/cli/*.tgz --access public

  # The Launch in AWS button's installer: its quick-create template and the setup page's code, in
  # the public installer bucket (docs/releases.md, one-time owner setup). After npm, so latest/
  # never points at a CLI that is not published yet; the versioned files before latest/, which
  # points at them.
  installer:
    needs: npm
    # #1570: as `images`, on the direct need's result.
    if: "!cancelled() && needs.npm.result == 'success' && vars.AGENTX_PUBLISH_ENABLED == 'true' && vars.AGENTX_INSTALLER_BUCKET != ''"
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      # release:installer imports workspace packages by their built (gitignored) dist/ output.
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AGENTX_PUBLISH_ROLE_ARN }}", aws-region: us-east-1 }
      - env:
          VERSION: ${{ github.ref_name }}
          BUCKET: ${{ vars.AGENTX_INSTALLER_BUCKET }}
        run: |
          VERSION="${VERSION#v}"
          npm run release:installer -- --version "$VERSION" --bucket "$BUCKET" --out "$RUNNER_TEMP/installer"
          aws s3 cp --recursive "$RUNNER_TEMP/installer/$VERSION" "s3://$BUCKET/$VERSION"
          aws s3 cp "$RUNNER_TEMP/installer/latest/installer.template.json" "s3://$BUCKET/latest/installer.template.json" --cache-control "max-age=300"
