name: CI

# Pull requests and manual runs, to save Actions minutes. A merge to mainline does not run CI
# again: its pull request's run already tested the change. A draft pull request runs nothing until it
# is marked ready for review. One branch also runs on push: `code/next`, where the controller lands the
# Rovara Code port lanes (docs/porting.md); a pull request into it runs like any other, and both also
# run the port guard (the `port-guard` job below).
on:
  workflow_dispatch:
    inputs:
      linux:
        description: Also run the Linux runtime check (#1185)
        type: boolean
        default: false
  pull_request:
    # `labeled` so that adding the `full-ci` label starts a FULL run. Any other label starts an ordinary run too (a skipped run would leave a skipped `local` that reads as a pass).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [code/next]
  # #1185, #1192: the nightly run on mainline (the default branch): the non-blocking device emulator check and the typecheck. (The Linux runtime check runs in the release.)
  schedule:
    - cron: "0 6 * * *"

# Read-only by default; a job that needs more says so itself (linux-runtime reads packages, live-aws mints an OIDC token).
permissions:
  contents: read

# Pushing to a pull request again supersedes its run in progress. A manual run is never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two modes (DEC 242; scripts/ci-plan.ts decides, in the `plan` job, and every other job reads its answer).
# FULL: a push to code/next, a manual run, a pull request labelled `full-ci` or titled "Batch ..." or "Sync mainline ...". Everything runs: the typecheck and the whole lint
#   in `quick`, the release check, all 8 `test (n/8)` shards, and the check `ci-mode (full)`, which exists only in this mode: a merge needs it.
# AFFECTED (a pull request, the default): the typecheck stays full; the tests are the ones the change can reach, in 2 shards (the whole suite when something shared changes);
#   lint covers the changed files; the release check runs only when its area changes; a Markdown-only change that no test reads runs nothing but `plan`.
# `linux-runtime` (#1185) runs in either mode only when its area changes, on each push to code/next (once per batch), nightly (the schedule, which runs it and the
#   typecheck only), or on request: the `linux-ci` or `full-ci` label, or a manual run's `linux` input.
# The job called `local` waits for every job and is the one check a pull request needs (scripts/ci-gate.ts). It knows from `plan` which jobs must have run, so a job
# skipped by design counts as a pass but a job that should have run and did not fails it. `port-guard` is a check of its own. A draft skips every job.
#
# Build once: the `build` job builds the packages and hands the output to the test shards as an artifact, so the shards do not each build it again.
jobs:
  # The decision. A few seconds on a runner with no install: Node runs the script directly.
  plan:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
      lint: ${{ steps.plan.outputs.lint }}
      linux: ${{ steps.plan.outputs.linux }}
      device: ${{ steps.plan.outputs.device }}
      device_required: ${{ steps.plan.outputs.device_required }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # Depth 2 keeps the pull request's merge commit and its first parent, the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Plan the run
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CI_TITLE: ${{ github.event.pull_request.title }}
          CI_FORCE_LINUX: ${{ github.event.inputs.linux }}
          CI_BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request the script is the base branch's copy, never the pull request's own: a change to ci-plan.ts cannot change how its own run is judged (scripts/port-guard.ts also lists it as a guard file).
          # The base branch has the file unless this is the pull request that adds it, which no pull request can fake, so only then does the checkout's copy run. A failed fetch fails the step.
          PLAN_SCRIPT=scripts/ci-plan.ts
          if [ "$CI_EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:scripts/ci-plan.ts" 2>/dev/null; then
              PLAN_SCRIPT="$RUNNER_TEMP/ci-plan.ts"
              git show "$BASE_SHA:scripts/ci-plan.ts" > "$PLAN_SCRIPT"
            fi
          fi
          if [ "$CI_EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node "$PLAN_SCRIPT" "$RUNNER_TEMP/changed.txt"

  # Present (and green) only in a FULL run, so that a merge can require `ci-mode (full)`.
  ci-mode:
    name: ci-mode (full)
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "FULL run - every job runs in full (the plan job says why)."

  # What the old `scope`, `checks` and `release` jobs did, in one job: one checkout, one install, one runner.
  # Each part keeps its own condition and its own step time limit; the job's limit is the sum of the old ones (5 + 15 + 15). A failed step
  # fails the job, and its name starts with the part it belongs to (checks, release). A Markdown-only change skips the job (the plan says so).
  quick:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: "checks: npm ci"
        timeout-minutes: 15
        run: npm ci
      - name: "checks: npm run typecheck"
        timeout-minutes: 15
        run: npm run typecheck
      # The stricter type check (tsconfig.lint.json, which also covers tests/ and scripts/) may not
      # add errors beyond tests/typecheck-baseline.json (issue #50, scripts/typecheck-baseline.ts).
      - name: "checks: npm run typecheck:all"
        timeout-minutes: 15
        run: npm run typecheck:all
      # The whole repository with the rules of `eslint .`, but in shards (scripts/lint-shards.ts), two eslint processes at a time. One process
      # over the whole repository needed more than 6 GB; each shard stays under a 4 GB heap cap. It reads the packages' declarations that
      # `npm run typecheck` just built. A pull request that changes no lint setting lints only its changed TypeScript files, each in its own shard's program.
      - name: "checks: npm run lint"
        if: needs.plan.outputs.lint == 'all'
        timeout-minutes: 15
        run: npm run lint
      - name: "checks: lint the changed files"
        if: needs.plan.outputs.lint == 'changed'
        timeout-minutes: 15
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          node scripts/lint-shards.ts --files "$RUNNER_TEMP/changed.txt"
      # The release check shares the install above (the old `release` job ran its own `npm ci`); the rest runs as before, when the release area changed (always in a FULL run).
      - name: "release: npm run build"
        if: needs.plan.outputs.release == 'true'
        timeout-minutes: 15
        run: npm run build
      - name: "release: npm run infra:synth"
        if: needs.plan.outputs.release == 'true'
        timeout-minutes: 15
        run: npm run infra:synth
      - name: "release: Release builds are reproducible"
        if: needs.plan.outputs.release == 'true'
        timeout-minutes: 15
        run: |
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-a"
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-b"
          diff "$RUNNER_TEMP/release-a/release.json" "$RUNNER_TEMP/release-b/release.json"
          npm run release:verify -- "$RUNNER_TEMP/release-a"

  # Builds the packages once and hands the output to the test shards (they used to run `npm run build` eight times).
  build:
    needs: plan
    if: needs.plan.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The packages import each other through their built output.
      - run: npm run build
      # Everything the build left that git ignores, except node_modules anywhere (each shard installs its own): the packages' dist folders and their tsbuildinfo files.
      - name: Pack the build output
        run: |
          git ls-files --others --ignored --exclude-standard --directory | grep -v 'node_modules/' > "$RUNNER_TEMP/build-files.txt"
          test -s "$RUNNER_TEMP/build-files.txt"
          tar -czf "$RUNNER_TEMP/build-output.tgz" -T "$RUNNER_TEMP/build-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.tgz
          retention-days: 1
          if-no-files-found: error

  # Vitest hands each shard a share of the test files balanced by their recorded run time (tests/support/duration-sequencer.ts, tests/.timings/vitest-durations.json).
  # The shard list comes from the plan: 8 for a FULL run or a change to something shared, 2 for an ordinary pull request.
  test:
    needs: [plan, build]
    if: needs.plan.outputs.tests != 'none'
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    # #1200: a pull request into mainline from this repository runs its shards on the account's CodeBuild ARM runner (infra/lib/ci-runner.ts), where they
    # don't wait for a free GitHub runner; everything else (code/next, a fork's pull request) runs them on GitHub's free runner, as before.
    runs-on: ${{ (github.event_name == 'pull_request' && github.base_ref == 'mainline' && github.event.pull_request.head.repo.full_name == github.repository) && format('codebuild-rovara-ci-tests-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    # 40, not 25: shard 2 passed 25 minutes on 2026-11-14 as code/next grew (PRs #612, #517 cancelled at the limit); shards 1, 3, 4 take 17-21.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # tests/unit/port-guard.test.ts runs the real secret scan, and its re-check 3 cases fail loudly without gitleaks (they never skip). Same pinned
      # release and checksum as the port-guard job below; keep the two in step.
      # #1200: the x64 or the arm64 build, for this runner (CodeBuild's is arm64); the arm64 checksum is the release's (infra/lib/release-pipeline.ts).
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          if [ "$(uname -m)" = aarch64 ]; then arch=arm64; sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080; else arch=x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb; fi
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${arch}.tar.gz"
          echo "${sum}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      # The packages import each other through their built output, which the `build` job made.
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Unpack the build output
        run: tar -xzf "$RUNNER_TEMP/build-output/build-output.tgz"
      # #1200: CodeBuild runs the job as root, and root can write to any file, so the tests that prove a read-only git directory is refused as writable cannot
      # pass as root. As the release does (scripts/release-common.ts runTests, testEnvironment), the tests then run as an unprivileged account (65534) that owns
      # the checkout, in an environment like a GitHub runner's: a short HOME and TMPDIR under /tmp (Unix socket paths stay under about 108 bytes, and the spool's
      # directory ancestry is root-owned and sticky), only the PATH directories that account can enter (a missing command is ENOENT, not EACCES), no AWS_* or
      # npm_* variables (CodeBuild's credential endpoint would make the worker refuse to start, and the tests need no AWS access), a step summary it can
      # write, no group- or world-writable directory above the checkout (the application spool's ancestry check), and a reaper for orphaned processes: the
      # container's PID 1 does not reap them, so a killed grandchild stays a zombie that kill(pid, 0) still finds (systemd reaps them on a GitHub runner).
      # Root keeps working in the checkout (safe.directory, in this throwaway container only). On GitHub's runner (not root) this does nothing and AS_TESTER
      # stays empty.
      - name: Run the tests as an ordinary account (CodeBuild only)
        run: |
          if [ "$(id -u)" != 0 ]; then exit 0; fi
          git config --global --add safe.directory '*'
          as="setpriv --reuid=65534 --regid=65534 --clear-groups"
          mkdir -p /tmp/h /tmp/t
          chown 65534:65534 /tmp/h /tmp/t
          chmod 700 /tmp/h /tmp/t
          touch /tmp/h/step-summary.md && chown 65534:65534 /tmp/h/step-summary.md
          chown -R 65534:65534 "$GITHUB_WORKSPACE"
          # Every directory above the checkout, Node and gitleaks must be enterable by that account, and none above the checkout writable by others.
          for path in "$GITHUB_WORKSPACE" "$(dirname "$(command -v node)")" "$RUNNER_TEMP/gitleaks-bin"; do
            while [ "$path" != / ]; do chmod o+x "$path"; path="$(dirname "$path")"; done
          done
          path="$(dirname "$GITHUB_WORKSPACE")"
          while [ "$path" != / ]; do chmod go-w "$path"; path="$(dirname "$path")"; done
          # The reaper: a child subreaper (PR_SET_CHILD_SUBREAPER) that runs the tests and reaps every orphan that dies under it.
          cat > /tmp/h/reaper.py <<'PY'
          import ctypes, os, signal, sys
          ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0)
          child = os.fork()
          if child == 0:
              os.execvp(sys.argv[1], sys.argv[1:])
          for number in (signal.SIGTERM, signal.SIGINT, signal.SIGHUP):
              signal.signal(number, lambda received, frame: os.kill(child, received))
          code = 1
          while True:
              try:
                  pid, status = os.wait()
              except ChildProcessError:
                  break
              if pid == child:
                  code = os.waitstatus_to_exitcode(status)
                  break
          while True:
              try:
                  pid, _ = os.waitpid(-1, os.WNOHANG)
              except ChildProcessError:
                  break
              if pid == 0:
                  break
          sys.exit(code if code >= 0 else 128 - code)
          PY
          chown 65534:65534 /tmp/h/reaper.py
          chmod o+r "$RUNNER_TEMP"/*.txt 2>/dev/null || true
          tester_path=""
          IFS=: read -ra dirs <<< "$PATH"
          for dir in "${dirs[@]}"; do
            if [ -n "$dir" ] && $as test -x "$dir"; then tester_path="${tester_path:+$tester_path:}$dir"; fi
          done
          unset_vars="$(env | grep -oiE '^(aws|npm)_[a-z0-9_]*' | sort -u | sed 's/^/-u /' | tr '\n' ' ')"
          echo "AS_TESTER=$as env $unset_vars HOME=/tmp/h TMPDIR=/tmp/t PATH=$tester_path GITHUB_STEP_SUMMARY=/tmp/h/step-summary.md /usr/bin/python3 /tmp/h/reaper.py" >> "$GITHUB_ENV"
          echo "available parallelism: $(node -p 'require("os").availableParallelism()'), memory: $(free -g | awk '/Mem:/{print $2}') GB; unset: $unset_vars"
      - name: Tests (the whole suite)
        if: needs.plan.outputs.tests == 'all'
        run: $AS_TESTER npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # Vitest's --changed follows imports; the plan adds the tests that name a changed file or a package the change reaches (scripts/ci-plan.ts relatedTests).
      - name: Tests (the ones this change can reach)
        if: needs.plan.outputs.tests == 'changed'
        env:
          # The nightly-only tests (tests/support/vitest-shared-config.ts) run here too, but only when this change reaches them.
          ROVARA_NIGHTLY_TESTS: "1"
          CI_EVENT: ${{ github.event_name }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CI_TITLE: ${{ github.event.pull_request.title }}
          CI_EXTRA_TESTS: ${{ runner.temp }}/extra-tests.txt
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request the script is the base branch's copy, never the pull request's own: a change to ci-plan.ts cannot change how its own run is judged (scripts/port-guard.ts also lists it as a guard file).
          # The base branch has the file unless this is the pull request that adds it, which no pull request can fake, so only then does the checkout's copy run. A failed fetch fails the step.
          PLAN_SCRIPT=scripts/ci-plan.ts
          if [ "$CI_EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:scripts/ci-plan.ts" 2>/dev/null; then
              PLAN_SCRIPT="$RUNNER_TEMP/ci-plan.ts"
              git show "$BASE_SHA:scripts/ci-plan.ts" > "$PLAN_SCRIPT"
            fi
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          node "$PLAN_SCRIPT" "$RUNNER_TEMP/changed.txt"
          [ -f "$CI_EXTRA_TESTS" ] && chmod o+r "$CI_EXTRA_TESTS"
          $AS_TESTER npm test -- --changed HEAD^1 --passWithNoTests --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          if [ -s "$CI_EXTRA_TESTS" ]; then xargs $AS_TESTER npm test -- --passWithNoTests --shard=${{ matrix.shard }}/${{ strategy.job-total }} < "$CI_EXTRA_TESTS"; fi

  # The tests too slow for every pull request (nightlyOnlyFiles in tests/support/vitest-shared-config.ts), once a night. A pull request runs one only when its
  # change reaches it (the "changed" step above).
  nightly-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # About 40 minutes of test time on a small runner (the eval simulation, the detectors' growth check, local-up-flow and the workflow-e2e suites).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:nightly

  # Real Chromium E2E checks need a Linux ARM64 Docker host, the platform Rovara's runtime targets. This job
  # builds the pinned browser executor image, smoke-tests it with no network, then runs tests/linux against
  # it. Docker's bridge networks on the runner can reach the cloud metadata service; the first step drops
  # that traffic so the containment tests see what a locked-down host shows.
  #
  # Public registries rate-limit the shared runners' anonymous pulls (`toomanyrequests: Rate exceeded`), so this job pulls each public image once, from the GHCR
  # mirror (.github/ci-images.json, copied digest for digest by the Mirror CI images workflow), with GITHUB_TOKEN and no cloud credentials. The upstream registry is
  # the fallback only when the mirror copy is missing, and every pull retries with backoff. Everything after that uses the local copy: the executor image is built
  # from it, the tests use it, and the Docker 25 (dind) daemon is loaded from the runner's daemon with docker save | docker load and never pulls.
  linux-runtime:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # The very rules the EC2 worker installs at boot: the heredoc inside boot.sh, extracted and run unchanged, so CI and production cannot drift.
      - name: Wall containers off from the host, private networks and the metadata service
        run: |
          sed -n "/<<'FIREWALL'/,/^FIREWALL\$/p" packages/worker/ec2/boot.sh | sed '1d;$d' > "$RUNNER_TEMP/container-firewall.sh"
          test "$(wc -l < "$RUNNER_TEMP/container-firewall.sh")" -gt 5
          sudo bash "$RUNNER_TEMP/container-firewall.sh"
          sudo iptables -S DOCKER-USER
          sudo iptables -S INPUT
      # Chromium's own sandbox needs unprivileged user namespaces. Ubuntu 24.04 blocks them for AppArmor-confined processes such as Docker containers
      # (kernel.apparmor_restrict_unprivileged_userns=1); this only turns that CI-runner restriction off. Production runners are Amazon Linux 2023,
      # which has no such restriction (its kernel only needs user.max_user_namespaces > 0, the default, and the chromium-sandbox-v1 probe fails if not).
      - name: Allow unprivileged user namespaces for Chromium's sandbox
        run: |
          # CI runner only: production runners (Amazon Linux 2023) have no AppArmor userns restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "no AppArmor userns restriction on this kernel"
          sysctl user.max_user_namespaces
      # A failed login (for example a pull request from a fork, whose token cannot read packages) only means the mirror is skipped.
      - name: Log in to the GHCR image mirror (read-only)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "::warning::GHCR login failed; images will come from their upstream registries"
      # Exports ROVARA_CI_IMAGE_NODE_BUILD and ROVARA_CI_IMAGE_DOCKER_DIND (local aliases of the digest-pinned images) to the steps below.
      - name: Pull the pinned public images (GHCR mirror first)
        run: node scripts/ci-images.ts pull --github-env
      # The Dockerfile's FROM lines name the pinned upstream image; the build uses a copy whose FROM lines name the local alias of the very same digest, so it pulls nothing.
      - name: Build the executor image
        run: |
          node scripts/ci-images.ts verify node-build
          node scripts/ci-images.ts dockerfile environments/e2e-executor/Dockerfile "$RUNNER_TEMP/e2e-executor.Dockerfile"
          docker build -f "$RUNNER_TEMP/e2e-executor.Dockerfile" -t rovara-e2e-executor:ci .
      - run: npm ci
      # The packages import each other through their built output.
      - run: npm run build
      # The executor as the host runs it (the pinned seccomp profile, every capability dropped, read-only, no network), from the one definition the release path and
      # test-deploy use too. The smoke check fails unless Chromium's renderer is sandboxed.
      - name: Smoke-test the executor image without a network
        id: runtime_setup
        run: npx tsx scripts/executor-smoke.ts rovara-e2e-executor:ci
      # Once setup and smoke pass, independent checks report even after a sibling fails. Cancellation still stops them.
      # A failed check still fails the job; no continue-on-error. The gateway stays last because it restarts Docker.
      - name: Linux runtime tests
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux --exclude tests/linux/e2e-docker25-dns.test.ts --exclude tests/linux/e2e-model-channel.test.ts --exclude tests/linux/e2e-agent.test.ts --exclude tests/linux/e2e-agent-probes.test.ts --exclude tests/linux/e2e-midstep-carriers.test.ts --exclude tests/linux/device-evidence-emulator.test.ts --exclude tests/linux/worker-sandbox-egress.test.ts
      # The EC2 worker runs Docker 25 (the only version Amazon Linux 2023 ships), which does not forward an internal-only container's DNS queries to a --dns server; this runner's
      # Docker is newer and does, so the step above cannot see that. This one starts Docker 25.0.5 in Docker (a privileged container with its own network namespace, no change to this
      # runner) and runs the production host against it: the app's lookup of an undeclared name must reach the sinkhole, and a mock's alias must resolve.
      - name: Docker 25 DNS regression (dind 25.0.5)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/e2e-docker25-dns.test.ts
      # M1.4 Task 4.3a: the worker <-> executor model channel on this Docker host (a scripted model route): the executor container's client reaches the proxy through the mounted
      # socket and the receipt is written, the app container sees neither the socket nor the proxy, and no socket is left behind. It builds a small derived executor image.
      - name: Model channel (scripted route)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/e2e-model-channel.test.ts
      # M1.4 Task 4.3b: the agent step on this Docker host (a scripted model route, the m14 orders app, the real executor image and Chromium): the renamed export is found by its test
      # id and downloaded once (twenty times in a row, three at a time), a model that does nothing, a decoy, an outage and a second download each leave their record.
      - name: Agent steps (scripted route)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/e2e-agent.test.ts
      # M1.4 Task 4.5: the three agent qualification probes through the production probe runner on this Docker host (the scripted route: no provider, no spend): the renamed export is
      # found and downloaded, a model that does nothing leaves the case UNKNOWN agent-no-download, and the app starts behind a guard that finds no path to the model.
      - name: Agent qualification probes (scripted route)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/e2e-agent-probes.test.ts
      # MIDSTEP-2 (option A): values the app acquires after the step's first model call (a session cookie, local and session storage, a JSON leaf, a `?token=` URL, an Authorization
      # header, IndexedDB, one opaque id) never reach the model: the real executor image and Chromium on this Docker host, the scripted route recording every call, three groups of three
      # cases. Strong values are refused in any spelling, the weak one shows as `<session>`, a control case goes through, no transcript is truncated. Values are random for each run.
      - name: Mid-step values never reach the model (scripted route)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/e2e-midstep-carriers.test.ts
      # The browser path end to end through the real worker, broker and this Docker host: a failing round, send-back, a passing round, publication.
      # It skips unless Docker and the executor image are provided, so it is a native-suite file that only this job runs.
      - name: Native browser journey
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run --config vitest.native-p0.config.ts tests/e2e/m1-web-journey.test.ts
      # The M1.3 paths on the same Docker host: an external origin served by its approved mock, and a call no mock matches.
      - name: Native M1.3 journeys
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run --config vitest.native-p0.config.ts tests/e2e/m1-3-journeys.test.ts
      # The M1.4 paths with an AI navigation step (scripted model), through the worker's own checks: what the executor and the worker leave. The verdicts are Task 4.4's.
      - name: Native M1.4 journeys
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run --config vitest.native-p0.config.ts tests/e2e/m1-4-journeys.test.ts
      # L4-NETG / NETG2 / NETG3: the EC2 worker's sandbox-egress boot stage on REAL Docker. It restarts Docker (twice), sets the daemon's default name server and proxy, and walls docker0 and the old agentx-task
      # bridge, so it runs ALONE, last, after every other Docker step (never beside another test file), and its afterAll takes back the firewall rules it added.
      - name: Sandbox egress gateway (boot stage on real Docker)
        if: (success() || failure()) && steps.runtime_setup.outcome == 'success'
        env:
          ROVARA_DOCKER: "1"
          ROVARA_EXECUTOR_IMAGE: rovara-e2e-executor:ci
        run: npx vitest run tests/linux/worker-sandbox-egress.test.ts

  # Device testing slice 2 (DEC 244): a real Android emulator with Maestro, in the device executor image, with KVM. It needs an x86-64 machine (Google ships no supported Linux arm64 emulator, so this
  # is not the ARM `linux-runtime` job) and KVM, which GitHub's standard Linux runners give public repositories once /dev/kvm is open to every user. The test checks KVM itself: with none it SKIPS with
  # the reason on the log and as a warning annotation, never a silent pass. It builds a tiny fixture app twice with the runner's own JDK and Android SDK (tests/fixtures/device-evidence-app), starts the
  # device executor beside a network-less container that stands in for the task sandbox, and checks the masked pictures, the arguments as Docker understood them, and the listeners in the shared loopback.
  # QUARANTINED (DEC 254zn): this test is flaky (the Android SDK download, the emulator's pictures), so it runs ONLY when device or emulator files change (scripts/ci-plan.ts DEVICE_PATTERNS), and once in each
  # "Batch " pull request and each push to code/next (and the nightly scheduled run, #1185) so indirect breakage is still seen. A manual run (code-ci.sh) does not run it. The image build is retried, and the test retries itself twice
  # (`retry: 2` in the test file). It is REQUIRED (a red job fails the run) when the change touches device files (`device_required`); in every other run it is `continue-on-error`: a flake there shows as a warning
  # annotation and does not fail the run. It is not in the `local` gate and not a branch-protection check.
  # It uses no secret and no permission beyond the workflow's `contents: read`: it pulls only the one image the device Dockerfile builds on (the registry fallback in scripts/ci-images.ts needs no login).
  device-runtime:
    needs: plan
    if: needs.plan.outputs.device == 'true'
    # Quarantine: required only when the change touches device files (see the comment above). `needs.plan.outputs.device_required` is empty if the plan script predates it, which also means non-blocking.
    continue-on-error: ${{ needs.plan.outputs.device_required != 'true' }}
    runs-on: ubuntu-latest
    # 90: up to 3 image builds and up to 3 attempts of the picture test (DEC 254zn retries).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # CI runner only: the kvm group is the only one that may open /dev/kvm until this rule makes the device open to every user (the container is given the device and, when it is not open to everyone, its group).
      - name: Open /dev/kvm to every user (CI runner only)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning title=No KVM on this runner::/dev/kvm is missing, so the emulator test will be SKIPPED (with its reason)"
      # Only the base image of the device Dockerfile (node-build); it exports ROVARA_CI_IMAGE_NODE_BUILD, the local alias the build below uses.
      - name: Pull the pinned base image
        run: node scripts/ci-images.ts pull --github-env node-build
      - name: Build the device executor image
        run: |
          node scripts/ci-images.ts verify node-build
          node scripts/ci-images.ts dockerfile environments/device-executor/Dockerfile "$RUNNER_TEMP/device-executor.Dockerfile"
          # The Android SDK download (sdkmanager) fails now and then: try the build up to 3 times. Docker keeps the layers that finished, so a retry resumes at the step that failed.
          attempt=1
          until docker build -f "$RUNNER_TEMP/device-executor.Dockerfile" -t rovara-device-executor:ci .; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=Device executor image build failed::the build failed $attempt times in a row"
              exit 1
            fi
            echo "::warning title=Device executor image build failed, retrying::attempt $attempt of 3 failed (the Android SDK download is the usual cause)"
            attempt=$((attempt + 1))
            sleep $((attempt * 20))
          done
      - run: npm ci
      # The packages import each other through their built output.
      - run: npm run build
      - name: Device emulator test
        env:
          ROVARA_DOCKER: "1"
          ROVARA_DEVICE_IMAGE: rovara-device-executor:ci
        # The fixture apps are built with the runner's own JDK 17 and Android SDK (ANDROID_HOME is set on the runner).
        run: JAVA_HOME="$JAVA_HOME_17_X64" npx vitest run tests/linux/device-evidence-emulator.test.ts
      # Say plainly, on the run's summary, that a red job here does not block this change.
      - name: Say that a failure here is non-blocking
        if: failure() && needs.plan.outputs.device_required != 'true'
        run: echo "::warning title=device-runtime is quarantined (non-blocking)::the emulator test failed, but this change touches no device files, so the run is not failed by it (DEC 254zn). Root cause is tracked in DEFERRED-CHECKS."

  # The Rovara Code port (docs/porting.md): nothing Cloud-only, no private name and no secret may reach code/next. The guard runs on a push to
  # code/next and on a pull request into it (not a draft), over everything code/next holds that mainline does not; mainline's own pull requests
  # do not run it. It needs no secret and no `npm ci`: Node runs the script directly. The gitleaks release is pinned by version and checksum.
  # On a pull request the guard that runs is the base branch's copy, so the pull request cannot weaken the check that judges it; a second run
  # of that copy over the pull request's own commits, without --allow-guard-edits, turns red on any edit to the guard, its tests, the
  # `port:guard` script or this file, which the controller must then review by hand. On a push the run is after the fact (the content is already
  # on code/next), so it detects and does not prevent; the controller's own run before the merge is the preventive one. It is a check of its own,
  # not part of the `local` gate (a skipped job would fail that gate on mainline's pull requests).
  port-guard:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'code/next' && github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so that origin/mainline and the merge base are there.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          if [ "$(uname -m)" = aarch64 ]; then arch=arm64; sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080; else arch=x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb; fi
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${arch}.tar.gz"
          echo "${sum}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Port guard over everything code/next holds beyond mainline
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The base branch's copy judges the pull request; a pull request that rewrites the guard is judged by the old one. No fallback to the checkout's copy: code/next has the guard, so a failure here must stop the step.
            git show origin/code/next:scripts/port-guard.ts > "$RUNNER_TEMP/port-guard.ts"
            # The guard reads the boundary data (Cloud-only package names, the four public AWS adapters) from beside itself, never from the checkout.
            # No fallback: if code/next has no such file this step fails, so a pull request's own copy of the data is never what judges it.
            git show origin/code/next:scripts/boundary-allowlist.json > "$RUNNER_TEMP/boundary-allowlist.json"
            # The accepted findings, also from code/next and never from the pull request (a pull request cannot accept its own findings). Without the file
            # nothing is accepted, which is only stricter.
            if git cat-file -e origin/code/next:scripts/port-guard-accepted.json 2>/dev/null; then git show origin/code/next:scripts/port-guard-accepted.json > "$RUNNER_TEMP/port-guard-accepted.json"; fi
            node "$RUNNER_TEMP/port-guard.ts" --range origin/mainline..HEAD --allow-guard-edits
          else
            npm run port:guard -- --range origin/mainline..HEAD --allow-guard-edits
          fi
      # Commits already on mainline are public, so their own private-name findings are skipped here (--public-base, a full ref name: a short one can resolve to a tag); the net diff and every other rule still count.
      - name: Edits to the guard need the controller's review (pull requests only)
        if: github.event_name == 'pull_request'
        run: node "$RUNNER_TEMP/port-guard.ts" --range origin/code/next..HEAD --public-base refs/remotes/origin/mainline

  # The one check a pull request needs. It runs even when a job before it failed or was cancelled.
  local:
    needs: [plan, quick, build, test, linux-runtime, ci-mode]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Every job passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request the script is the base branch's copy, never the pull request's own: a change to ci-gate.ts cannot change how its own run is judged (scripts/port-guard.ts also lists it as a guard file).
          # The base branch has the file unless this is the pull request that adds it, which no pull request can fake, so only then does the checkout's copy run. A failed fetch fails the step.
          GATE_SCRIPT=scripts/ci-gate.ts
          if [ "$CI_EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:scripts/ci-gate.ts" 2>/dev/null; then
              GATE_SCRIPT="$RUNNER_TEMP/ci-gate.ts"
              git show "$BASE_SHA:scripts/ci-gate.ts" > "$GATE_SCRIPT"
            fi
          fi
          node "$GATE_SCRIPT"

  live-aws:
    if: github.event_name == 'workflow_dispatch' && vars.AGENTX_ENABLE_AWS_TESTS == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
