name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [mainline]

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run infra:synth
      - name: Release builds are reproducible
        run: |
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-a"
          npm run release:build -- --version 0.0.0-ci --out "$RUNNER_TEMP/release-b"
          diff "$RUNNER_TEMP/release-a/release.json" "$RUNNER_TEMP/release-b/release.json"
          npm run release:verify -- "$RUNNER_TEMP/release-a"

  live-aws:
    if: github.event_name == 'workflow_dispatch' && vars.AGENTX_ENABLE_AWS_TESTS == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
