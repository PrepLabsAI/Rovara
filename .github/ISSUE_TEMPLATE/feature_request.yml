name: Feature request
description: Propose a change to what AgentX does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today? Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How AgentX could solve it. Larger changes become a specification under specs/ before any code.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds or other tools you use now.
